version: '3.8'

services:
  db:
    image: postgres:16
    container_name: pki_audit_db
    environment:
      POSTGRES_USER: audit_admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: pki_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: